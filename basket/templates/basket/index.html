{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Кошик</h2>

  {% if items %}
  <div class="list-group mt-3">
    {% for item in items %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img src="{% if item.product.image %}{{ item.product.image.url }}{% elif item.product.image_url %}{{ item.product.image_url }}{% else %}https://png.pngtree.com/png-vector/20221125/ourmid/pngtree-no-image-available-icon-flatvector-illustration-picture-coming-creative-vector-png-image_40968940.jpg{% endif %}" alt="{{ item.product.name }}" class="img-thumbnail me-3" style="width:80px;height:80px;object-fit:cover;" />
        <div>
          <a href="{% url 'product_details' item.product.id %}" class="h5 mb-0">{{ item.product.name }}</a>
          <div class="text-muted">${{ item.product.price }} × {{ item.qty }} = ${{ item.subtotal }}</div>
        </div>
      </div>
      <div>
        <a href="{% url 'remove_basket_product' item.product.id %}?next={{ request.get_full_path }}" class="btn btn-outline-danger btn-sm">Видалити</a>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="mt-3 d-flex justify-content-end">
    <h5>Разом: ${{ total }}</h5>
  </div>
  {% else %}
  <div class="alert alert-info mt-3">Кошик порожній</div>
  {% endif %}
</div>
{% endblock %}
