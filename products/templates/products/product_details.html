{% extends "layout.html" %} {% block content %}

<div class="container mt-4">
    <a href="{% url 'index' %}" class="btn btn-secondary mb-3">
        ← Назад до каталогу
    </a>

    <div class="row">
        <div class="col-md-6">
            <img
                src="{% if product.image %}{{ product.image.url }}{% elif product.image_url %}{{ product.image_url }}{% else %}https://png.pngtree.com/png-vector/20221125/ourmid/pngtree-no-image-available-icon-flatvector-illustration-picture-coming-creative-vector-png-image_40968940.jpg{% endif %}"
                class="img-fluid rounded"
                alt="{{ product.name }}"
            />
        </div>

        <div class="col-md-6">
            <h1>{{ product.name }}</h1>
            <h3 class="text-success mb-4">${{ product.price }}</h3>

            <h4>Опис</h4>
            <p>{{ product.description }}</p>

            <h4 class="mt-4">Наявність</h4>
            <p>
                <span class="badge bg-success">
                    В наявності: {{ product.stock }}
                </span>
            </p>

            <div class="mt-4 d-flex gap-2">
                {% if product.stock > 0 %}
                <form method="get" action="{% url 'add_basket_product' product.id %}" class="d-flex gap-2 align-items-center">
                    <input type="number" name="qty" value="1" min="1" max="{{ product.stock }}" class="form-control" style="width:100px;" />
                    <input type="hidden" name="next" value="{{ request.get_full_path }}" />
                    <button type="submit" class="btn btn-success btn-lg">Додати в кошик</button>
                </form>
                {% else %}
                <button class="btn btn-secondary btn-lg" disabled>Немає в наявності</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>

{% endblock %}
