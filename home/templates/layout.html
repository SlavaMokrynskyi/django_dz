{% load static %}
<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Products{% endblock %}</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
        />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="{% url 'index' %}">
                    🏪 Інтернет-магазин
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                    aria-controls="navbarContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'favorites' %}">
                                ❤️ Улюблені
                                {% if favorite_count > 0 %}
                                    <span class="badge bg-danger ms-1">{{ favorite_count }}</span>
                                {% endif %}
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'basket' %}">
                                🛒 Кошик
                                {% if basket_count > 0 %}
                                    <span class="badge bg-warning ms-1">{{ basket_count }}</span>
                                {% endif %}
                            </a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search" method="get" action="{% url 'index' %}">
                        <input
                            class="form-control me-2"
                            type="search"
                            placeholder="Пошук товарів..."
                            name="filter_search"
                        />
                        <button class="btn btn-outline-light" type="submit">
                            🔍 Пошук
                        </button>
                    </form>
                </div>
            </div>
        </nav>
        <main class="container py-4">{% block content %} {% endblock %}</main>
        <footer class="container py-4">
            <p class="text-muted mb-0">© 2025 Store</p>
        </footer>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <script>
            {% if messages %}
                {% for message in messages %}
                    Toastify({
                        text: "{{ message }}",
                        duration: 3000,
                        close: true,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "{% if message.tags == 'success' %}#28a745{% elif message.tags == 'error' %}#dc3545{% elif message.tags == 'warning' %}#ffc107{% else %}#17a2b8{% endif %}",
                    }).showToast();
                {% endfor %}
            {% endif %}
        </script>
    </body>
</html>
